<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
         
        }
        body{
            background-image: url('https://images.unsplash.com/photo-1503803548695-c2a7b4a5b875?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-repeat: no-repeat;
        }
        img{
            width:100x;
            height: 50px;
            padding-left: 70px;
        }
        .navbar{
            
            display: flex;
            margin-top: 20px;
            justify-content: space-between;
            align-items: center;
            width: 95%;



        }
        .navbar ul li{
            list-style: none;
            display: inline-block;
           margin: 0 20px;
           position: relative;
         }
        .navbar ul li a{
           color: black;
            text-decoration: none;
           
        }
        .navbar ul li::after{
            content: '';
            background-color:  #9b1c81;;
            width: 0;
            height: 3px;
            position: absolute;
            left: 0px;
            bottom: 0;
            transition:0.5s;
        }
        .navbar ul li:hover::after{
            width: 100%;
        }
        .content{
            width: 100%;
            height: 50%;
          text-align: center;
            margin-top: 80px;
        }
        .content h2{
            text-align: center;
            font-size: 85px;
            font-family: Georgia, 'Times New Roman', Times, serif;

        }
        .content p{
            text-align: center;
            margin-top: 50px;
            font-weight: bold;
        
        }
        button{
            width: 150px;
            height: 50px;
            border-radius: 25px;
            padding :10px 20px;
            margin-top: 30px;
            text-align: center;
            background: transparent;
            border: 2px solid #9b1c81;
            color:rgb(22, 143, 11);
            position: relative;
            cursor: pointer;
        }
        span{
            background-color: #9b1c81;
            width: 0;
            height: 100%;
            position: absolute;
            left: 0;
            bottom: 0;
            transition: 0.5s;
            border-radius: 25px;
            z-index: -1;
        }
        button:hover span{
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTajvJC04j-VE8X4eDavE9-fYf_b2UG7sBl-ct7g9KEeQICGRlQm-1ppmIkwSooG6wMd3c&usqp=CAU">
        <ul> 
            <li><a href="#">Family</a></li>
            <li><a href="#">Friends</a></li>
            <li><a href="#">Relatives</a></li>
            <li><a href="#">Part of life</a></li>
      
    </div>
    <div class="content">
        <h2>HAMARA JINDHAGI..!!!</h2>
        <p>Educating Yourself does not mean you were stupid in the first place ,it means that you are intelligent and you have worth and skill to<br>enough to knoe that there is plenty left to learn. </p>
        <div>
            <button type="button"><span></span>Contentment</button>
            <button type="button"><span></span>Melancholy</button>
        </div>
    </div>
</body>
</html>
