<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media Queries</title>
    <style>
        .box{
            background-color: red;
            text-align: center;
            color: white;
            font-size: 72px;
            display: none;
          
        }
        @media (max-width :300px){
            #box-1{
               display: block;
           
            }
        }   
        @media (min-width :300px) and (max-width :500px) {
            #box-2{
               display: block;
               background-color: blueviolet;
            }
        }  
        @media (min-width :500px) and (max-width :800px)  {
            #box-3{
               display: block;
               background-color: yellow;
            }
        }
        @media (min-width :800px){
            #box-4{
               display: flex;
               background-color: green;
            }
        } 
             
    </style>
</head>
<body>
    <div class="box" id="box-1">mai ek iphone ho</div>
    <div class="box" id="box-2">mai ek tablet ho</div>
    <div class="box" id="box-3">mai ek computer ho</div>
    <div class="box" id="box-4"> mai ek widescreen computre ho</div>
</body>
</html>
