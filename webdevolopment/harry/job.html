<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>job application (web)</h3>
    <form>
        <label for="fname">First name</label>
        <input type="text" name="fname" id="fname" value="enter the first name.....">&nbsp;&nbsp;&nbsp;
        <label for="lname">Last name</label>
        <input type="text" name="lname" id="lname" value="enter the last name.....">
        <br><br><br>
        <laber for="email">E mail</laber>
        <input type="text" name="email" id="email" value="enter Email...">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <label for="job">Job Role</label>
        <select name="job" id="job">
            <option value="backend devoloper" selected>Backend Devoloper</option>
            <option value="frontend devoloper">Frontend Devoloper</option>
            <option value="database administrator"> Database administrator</option>
            <option value="manager"> manager</option>
        </select>
        <!-- using of <br> so many times is not a good practice -->
        <br><br><br>
        <label for="add">Enter Address</label><br>
        <textarea name="add" id="add" rows="5" cols="100"></textarea>
        <br><br><br>
        <label for="city">City</label>
        <!-- using "&nbsp;" so many times is not a good practice -->
        <input type="text" name="city" id="city" value="Enter city....">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <label for="pin">Pincode</label>
        <input type="text" name="pin" id="pin" value="Enter pincode..">
        <br><br><br>
        <label for="date">Start Date</label>
        <input type="date" name="date" id="date">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <label for="cv">Upload Your Cp</label>
        <input type="file" value="Choose file" name="cv" id="cv">
        <br><br><br>
        <input type="submit" value="Apply Now"> 
      </form>
</body>
</html>
