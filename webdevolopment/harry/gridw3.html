<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            background-color: rgb(68, 165, 230);
            padding: 10px;
            grid-template-columns: auto auto auto;
            grid-template-rows: 20px 20px;
           grid-gap: 30px;
         
        }
        .item{
           padding: 20px;
        background-color: lightblue;
        text-align: center;

        }
        #item1{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        #item2{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        #item5{
            grid-column-start: 2;
            grid-column-end: 4;
        }
        .container2{
            display: grid;
            grid-row-gap: 2px;
            grid-column-gap: 1px;
            margin-top: 20px;
            grid-template-columns:1fr 1fr 1fr ;
            grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
           
      

        }
        .items{
            background-color: red;
            padding: 20px;
            text-align: center;
         }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="item1">Header</div>
        <div class="item" id="item2">Menu</div>
        <div class="item" id="item3"> Main</div>
        <div class="item" id="item4">Right</div>
        <div class="item" id="item5">Footer</div>   
    </div>
    <div class="container2">
        <div class="items" id="i1">item-1</div>
        <div class="items">item-2</div>
        <div class="items">item-3</div>
        <div class="items">item-4</div>
        <div class="items">item-5</div>
        <div class="items">item-6</div>
        <div class="items">item-7</div>
        <div class="items">item-8</div>
        <div class="items">item-9</div>
        <div class="items">item-10</div>
        <div class="items">item-11</div>
        <div class="items">item-12</div>
    </div>
</body>
</html>
