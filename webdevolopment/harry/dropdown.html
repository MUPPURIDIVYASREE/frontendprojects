<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drop down menu</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: sans-serif;
        }
        ul{
            list-style: none;

        }
        ul li{
            float :left;
            width: 140px;
            height:50px;
            background-color: aqua;
            text-align: center;
            line-height: 50px;
        }
        ul li ul li{
             display:none;
             background-color: white;
        }
        ul li:hover ul li{
            display: block;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">Home</a>
     
        </li>
        <li><a href="#">Tutorials</a>
            <ul>
                <li>item1</li>
                <li>item2</li>
                <li>item3</li>
                <li>item4</li>
            </ul>
        </li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Contact Us</a></li>
    </ul>
</body>
</html>
