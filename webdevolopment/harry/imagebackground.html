<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image background</title>
    <style>
        body{
            background-image: url(https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8d2F0ZXJmYWxsfGVufDB8fDB8fHww&auto=format&fit=crop&w=500&q=60);
             /* by defaultly the image is repeated so that with out repetition you follow the below line */
             background-repeat:no-repeat; 
            /* by this we can get the image to only the part of the background */
            /* to get the image to the whole */
            background-attachment: fixed;
            background-size:100%100%;
            /* background-size:cover */
        }
    </style>
</head>
<body>
    <h3 style="color:deeppink">to add image to the back ground</h3>
    <p> this the html to add the image as the back ground of the image</p>

</body>
</html>
