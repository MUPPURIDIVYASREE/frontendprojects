<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation</title>
    <style>
        .navbar{
            background-color: rgb(7, 2, 2);
            border: 1px solid black;
            border-radius: 50px;
        }
        .navbar ul{
            overflow: auto;
         margin: auto;
        }
        .navbar li{
            float: left;
            list-style: none;
            padding: 20px 10px;
            color: white;
            font-size: 15px;
            margin: 0px 30px 0px 0px;
        }
        .navbar li a{
            color: white;
            text-decoration: none;
        }
        .navbar li a:hover{
            color:gold;
            background-color: crimson;
        }
        .text{
            float: right;
            border-radius: 40px;
            margin: -40px 50px;
            box-sizing: border-box;
          
        }
        .text input{
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
    
            <ul>
              
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li> 
                <li><a href="#"> Help</a>
                </li>
                <li><a href="#">Contact us</a></li>
            </ul>
            <div class="text">
                <input type="text" name="text" placeholder="search here">
            </div>

        </nav>
    </header>
</body>
</html>
