<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display:flex;
            background-color: blueviolet;
            padding: 10px;
            height: 300px;
            width: 500px;
           /* flex-direction: row-reverse;*/
            flex-wrap: wrap;
           justify-content:space-around;
           align-items: center;
         
        }
        div p{
            background-color: yellowgreen;
            border: 2px solid yellow;
            height: 40px;
            margin-right: 10px;
            width: 70px;
            text-align: center;
        }
        .item{
            flex-shrink: 100px;
        }
    </style>
</head>
<body>
    <h2>Flex BASED example</h2>
    <div>
        <p class="item">1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
       
    </div>
</body>
</html>
