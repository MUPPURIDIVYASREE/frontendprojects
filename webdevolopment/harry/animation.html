<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animations
    </title>
    <style>
        .container{
            display: flex;
        }
        .box{
            background-color: green;
            width: 250px;
            height: 250px;
            position :relative;
            animation-name: harry2;
            /*animation-name: harry1;*/
            animation-duration: 0.5s;
            animation-iteration-count: 1;
            animation-fill-mode:alternate;
            animation-timing-function: ease-out;
            animation-delay: 1s;
            /*animation-direction: reverse;*/
                                    
        }
        @keyframes harry2{
            0%{
                top :0px;
                left: 0px;
                background-color: aqua;
            }
            25%{
                top :0px;
                left: 250px;
                background-color: deeppink;
            }
            75%{
                top :250px;
                left: 250px;
                background-color: chartreuse;
            }
            100%{
                top :250px;
                left: 0px;
            }
        }
        @keyframes harry1{
            from{
                width :0px;
            }
            to{
                width:800px;
            }
        }
       
   
    </style>
</head>
<body>
    <div class="container">
        <div class="box">This is a box

        </div>
    </div>
 
</body>
</html>
