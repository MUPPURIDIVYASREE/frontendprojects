<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class attribute</title>
    <style>
        .note{
            background-color: aqua;
            color:deeppink;
        }
        .cold{
            text-align: center;
            color: chartreuse;
        }
    </style>
</head>
<body>
    <div class="note">
        <h2>this is the heading2</h2>
        <p> this is the paragraph in the heading 2</p>
    </div>
    <div class="note">
        <h2>this is the another heading</h2>
        <p> this is the  another paragraph in the heading</p>
    </div>
    <!-- we can also use the same class to different elements -->
    <h3 class="note">this is the heading</h3>
    <p class="note">this is the paragraph related to the heading</p>
    <!-- we can also use more than one class to a one element -->
    <h2 class="note cold">this is the heading</h2>
    
</body>
</html>
