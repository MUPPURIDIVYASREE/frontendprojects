    <title>flex box</title>
    <style>
      *{
        box-sizing: border-box;
      }
        .container{
            width: 100%;
            height:250px;
            border:2px solid black;

        }
        .item{
            background-color: tomato;
            border: 2px solid green;
            margin: 5px;
            padding: 1px;
            height :200px;
            width : 200px;
        
        }
    </style>
</head>
