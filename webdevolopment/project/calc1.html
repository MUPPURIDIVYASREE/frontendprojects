<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
        }
        .main{
            border:2px solid black;
            margin:auto;
            width: 400px;
            height: 100vh;
            padding: 0px 70px;
            background-color: black;

        }
        .calculation{
            width: inherit;
        
            position: absolute;
            top: 70px;
            height: 70px;
            border-radius: 10px;
            background-color: white

        }
        .calculation p{
            float: right;
            position: absolute;
            bottom: 0px;
            right: 0px;
            font-weight: bold;
            font-size: 20px;
        }
        .grid-container{
            display: grid;
            grid-template-columns: auto auto auto auto;
            width:400px;
            height: 200px;
          grid-row-gap: 25px;
          grid-column-gap: 25px;
          margin-top: 45%;
         
        }
        .items{
            border: 2px solid black;
           width: 70px;
           height: 40px;
         border-radius: 5px;
           text-align: center;
           background-color: white;
      
        }
        .items button{
            width:inherit;
           height:inherit;
           background-color:white;
           border-radius:inherit;
           font-size: 25px;
           color: gray;
           font-weight: bolder;
        }
        button:hover{
            color:black;
            background-color: red;
            opacity: 0.5;
          
        }
        #reset{
            grid-column-start: 1;
            grid-column-end: 3;
            width: 178px;
        }
        #submit{
         
            grid-column-start: 3;
            grid-column-end: 5;
            width: 178px;
        }
        #reset button{
            background-color: green;
            color: white;
        }
        #submit button{
            background-color: rgb(243, 92, 33);
            color: white;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="calculation">
            <p>this is the text</p>
        </div>
        <div class="grid-container">
            <div class="items"><button>7</button></div>
            <div class="items"><button>8</button></div>
            <div class="items"><button>9</button></div>
            <div class="items"><button>DEL</button></div>
            <div class="items"><button>4</button></div>
            <div class="items"><button>5</button></div>
            <div class="items"><button>6</button></div>
            <div class="items"><button>+</button></div>
            <div class="items"><button>1</button></div>
            <div class="items"><button>2</button></div>
            <div class="items"><button>3</button></div>
            <div class="items"><button>-</button></div>
            <div class="items"><button>.</button></div>
            <div class="items"><button>0</button></div>
            <div class="items"><button>/</button></div>
            <div class="items"><button>x</button></div>
            <div class="items"id="reset"><button>Reset</button></div>
            <div class="items"id="submit"><button>=</button></div>
         
        </div>
    </div>
    <style>

    </style>
</body>
</html>
