<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

        body{

            font-weight: bold;

        h2{
            padding-top: 20px;

        label{
            font-size: small;
        }
        input{

        }

<body>
    <div>
