<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid black;
            padding: 20px;
        }
        h2{
            text-align: center;
        }
        input{
            width: 94vw;
            height: 30px;
            margin-bottom: 20px;
        }
        button{
            width: 100px;
            margin-left: 48%;
            background-color: lawngreen;
            height: 40px;
            width: 150px;
        }
        #demo{
            color: red;
            font-size: small;
            margin-top: -20px;
        }
    </style>
</head>
<body>
    <div>
        <h2>Registration form</h2>
        <form>
            <label for="fname">First Name:</label><br>
            <input type="text" id="fname" onclick="display(0)"><br>
            <label for="lname">Last Name:</label><br>
            <input type="text" id="lname" onclick="display(1)"><br>
            <label for="email1">Email:</label><br>
            <input type="email" id="email1" onclick="display(2)"><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" onclick="display(3)"><br>
            <p id="demo"></p>
        </form>
        <button onclick="valid()">register</button>
      
    </div>
    <script>
    function valid(){
        let x=document.getElementById("password").value;
        if(x.length<6){
             document.getElementById("demo").innerHTML="please enter atleast 6 charecters";
        }
        }
        function display(value){
        
                document.getElementsByTagName("input")[value].style.backgroundColor="lightcyan";
        }
        
    </script>
</body>
</html>
