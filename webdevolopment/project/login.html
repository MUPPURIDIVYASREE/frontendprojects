<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        
        body{
            background-image: url("https://e0.pxfuel.com/wallpapers/633/818/desktop-wallpaper-purple-nature-purple-scenery.jpg");
            background-repeat: no-repeat;
            background-size: cover;
    
        }
        div{
            margin:100px 250px 100px 400px; 
            border:1px solid black;
            width :500px;
            padding :5px;
            border-radius: 50px;
            border-color: aliceblue;
            border-style: double;
        
        }
        .a{
            color:black;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            

        }
        .b{
            margin-left: 150px;
            margin-top: 10px;
            border-radius: 50px;
            padding:7px;
            height:20px;
        }
        .c{
            margin-top: 20px;
            margin-left: 150px;
        }
        .d{
            margin-top: 50px;
            margin-left: 50px;
        }
        .button{
            background-color: white;
            color:black;
            text-align: center;
            margin :10px 100px 0px 100px;
            padding: 10px 70px 10px 70px;
            font-weight: bold;
            border-radius: 50px;
            
        }
        .last{
            text-align: center;
            text-decoration: none;
            color: white;
        }
       .remember{
        text-align: center;
            text-decoration: none;
            color: white;
            margin:5px 0px 0px 130px;
            font-size: smaller;
       }
      .forgot{
        font-size: smaller;
        margin:0px 0px 0px 180px ;
      }
       a{
        color:white;
        text-decoration: none;

       }
      
    </style>
</head>
<body>
    <div>
    <form>
        <p class="a">Login</p>
        <input type="text" name="username" placeholder="Username" class="b"><br>
        <input type="password" name="password" placeholder="password" class="b"><br>
        
      <small>  <span class="remember"><input type="checkbox" name="check" id="check">Remember me</span>
       
        <a href="array" class="forgot">Forgot password</a>
      </small>
        <button class="button">login</button>
        <p class="last">Don't have an account ?<span><a href="aref">Register?</a></span></p>

    </form>    
    </div>
</body>

</html>
