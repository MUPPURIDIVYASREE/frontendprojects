<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey form</title>
    <style>
        body{
            background-color: rgb(16, 214, 16);
        }
        h3{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: xx-large;
        }
        div{
            background-color: aliceblue;
            margin-top: 30px;
            margin-left: 350px;
            margin-right: 330px;
            margin-bottom: 20px;
            padding-left: 20px;
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .all{
           width: 500px;
           height:30px;
           padding-left: 2px;
           padding-bottom: 2px;
           margin-bottom: 20px;
           margin-top: 2px;

        }
        .yes{
            margin-top: 6px;
            margin-bottom: 6px;

        }
        .no{
            margin-bottom: 6px;
        }
        .maybe{
            margin-bottom: 20px;
        }
        textarea{
            margin-top: 0px;
            margin-bottom: 30px;

        }
        
    </style>
</head>
<body>
    <h3>Geeks for Geeks Survey Form</h3>
    <div>
    <label for="fname">Name</label><br>
    <input type="text" name="fname" id="fname" placeholder="Enter your name" class="all"><br>
    <label for="Email">Email</label><br>
    <input type="email" name="Eamil" id="Email" placeholder="Enter your Email" class="all"><br>
    <label for="Age">Age</label><br>
    <input type="text" name="Age" id="Age" placeholder="Enter your age" class="all"><br>
    <label for="describe">Which option best describes you?</label><br>
    <select name="describe" id="describe" class="all">
        <option value="Student">Student</option>
        <option value="teacher">teacher</option>
        <option value="non-teaching staff">non-teaching staff</option>
        <option value="children">children</option>
        <option value="head">head</option>
    </select><br>
    <label for="recomend">Would you recommend GeeksforGeeks to a friend?</label><br>
    <input type="radio" name="recomend" id="recomend" value="yes" class="yes">
    <label for="recomend">yes</label><br>
    <input type="radio" name="no" id="no" value="no" class="no">
    <label for="no">No</label><br>
    <input type="radio" name="may be" id="may be" value="May be" class="maybe">
    <label for="may be">May be</label><br>
    <label for="famework">Languages and Fameworks known <small>(Check all that apply )</small></label><br>
    <input type="checkbox" name="c" id="c" value="C" class="yes">
    <label for="c">C</label><br>
    <input type="checkbox" name="c++" id="c++" value="C++" class="no">
    <label for="c">C++</label><br>
    <input type="checkbox" name="C#" id="C#" value="C#" class="no">
    <label for="C#">C#</label><br>
    <input type="checkbox" name="java" id="java" value="Java" class="no">
    <label for="Java">Java</label><br>
    <input type="checkbox" name="Python" id="Python" value="Python" class="no">
    <label for="Python">Python</label><br>
    <input type="checkbox" name="JavaScript" id="JavaScript" value="JavaScript" class="no">
    <label for="JavaScript">JavaScript</label><br>
    <input type="checkbox" name="React" id="React" value="React" class="no">
    <label for="React">React</label><br>
    <input type="checkbox" name="Angular" id="Angular" value="Angular" class="no">
    <label for="Angular">Angular</label><br>
    <input type="checkbox" name="Django" id="Django" value="Django" class="no">
    <label for="Django">Django</label><br>
    <input type="checkbox" name="Spring" id="Spring" value="Spring" class="maybe">
    <label for="Spring">Spring</label><br>
    <p>Any comments or suggestions</p><br>
    <textarea rows="2" cols="65" ></textarea><br>
    <input type="submit" value="submit" class="all" style="background-color: rgb(16, 214, 16);">
    </div>
</body>
</html>
