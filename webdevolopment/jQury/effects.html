<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1,#div3{
            background-color: gray;
            color: white;
            text-align: center;
            padding: 10px 0px;
        }
        #div2,#div4{
            background-color: gray;
            color: white;
            text-align: center;
            padding: 10px 0px;
            display: none;

        }
        #div5,#div6{
            height:100px;
            width: 100px;
            background-color: gray;
            margin-top: 20px;
           
        }
        #div6{
            position: absolute;
            top: 150px;
        }
      
    </style>
</head>
<body>
    <div id="div1">
        click here to fade in/out
    </div>
    <div id="div2">
       <p>thsi is the paragraph</p>
       <p>thsi is the  another paragraph</p>
    </div >
    <div id="div3">
        click here to fade in/out
    </div>
    <div id="div4">
       <p>thsi is the paragraph</p>
       <p>thsi is the  another paragraph</p>
    </div >
   <div id="div5"></div>
   <div id="div6"></div>
    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js">  
    </script> 
    <script>
        $(document).ready(function(){
            $("#div1").mouseenter(function(){
                $("#div2").fadeTo(3000,0.5);
            });
            $("#div1").click(function(){
                $("#div2").fadeToggle(3000);
            });
            $("#div3").click(function(){
                $("#div4").slideToggle();
            });
           $("#div5").mouseenter(function(){
                $(this).animate({
                    right:'0'
                },"slow");
           });
           $("#div6").mouseenter(function(){
            var div=$(this);
            div.animate({bottom:'500',height:'200px'},"slow");
            div.animate({right:'250px',width:'200px'},"slow");
            div.animate({top:'250px',height:'200px'},"slow")
            div.animate({left:'0px'},"slow")
           });
        });
    </script> 
</body>
</html>
