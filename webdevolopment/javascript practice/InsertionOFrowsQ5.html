<!DOCTYPE html>
<html><head><meta charset=utf-8 />
<title>Insert row in a table - w3resource</title>
</head><body>
<table id="sampleTable" border="1">
<tr id="row1"><td>Row1 cell1</td>
<td>Row1 cell2</td></tr>
<tr><td>Row2 cell1</td>
<td>Row2 cell2</td></tr>
</table><br>
<input type="button" onclick="insert_Row()" value="Insert row"> 
<script>
    function insert_Row(){
        let form=document.getElementById("sampleTable");
        let rowone=document.getElementById("row1");

        const trow=document.createElement("tr");
        const tcell1=document.createElement("td");
        const data1=document.createTextNode("NewCell1");
        const tcell2=document.createElement("td");
        const data2=document.createTextNode("Newcell2");
        tcell1.appendChild(data1);
        tcell2.appendChild(data2);
        trow.appendChild(tcell1);
        trow.appendChild(tcell2);
        form.appendChild(trow);

    }
</script>
</body></html>
