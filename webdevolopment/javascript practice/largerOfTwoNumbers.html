<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>greatest number between two entered numbers</h2>
    <p id="demo"></p>
    <script>
        let a=prompt("enetr the number:");
        a=Number.parseInt(a);
         let b=prompt("enetr the another number:");
       b=Number.parseInt(b);
      let text=""
       if(a > b)
       {
        text+= a + "is grater than "+b;
       }
       else{
        text+= b + "is grater than "+a;
       }
       document.getElementById("demo").innerHTML=text;

    </script>
</body>
</html>
