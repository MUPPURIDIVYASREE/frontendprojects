<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=prompt("enter the number");
        for(let i=0;i<a;i++)
        {
            console.log(i);
        }
        // sum of natural numbers
        let num=prompt("enter the number");
        let sum=0;
        for(let j=1;j<=num;j++)
        {
            sum+=j;
        }
        console.log("the sum of namtural numbers up to you entered is" + sum );
        // sum of numbers using while loop
        let b=prompt("enter the number");
        let sum1=0;
        let k=1;
        while(k<=b)
        {
            sum1+=k;
            k++;
        }
        console.log("the sum of natural numbers is "+ sum1);
    </script>
</body>
</html>
