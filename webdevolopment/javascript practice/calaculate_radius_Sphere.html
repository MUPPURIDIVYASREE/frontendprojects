<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <p>Input radius value and get the volume of a sphere.</p>
    <form>
        <label for="name">radius</label><br>
        <input type="text" name="name" id="name"><br><br>
        <label for="calculate">volume</label><br>
        <input type="text" name="name" id="calculate" value="0">
    </form>
  <br><br>  <button onclick="operation()">calculate</button>
  <script>
        function operation(){
        let inname=document.getElementById("name").value;
        const v=(4/3)*Math.PI*(inname**3);
        document.getElementById("calculate").value=v.toFixed(4);
       
        
            
    }
  </script>
</body>
</html>
