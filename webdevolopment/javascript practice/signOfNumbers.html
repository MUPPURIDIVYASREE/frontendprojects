<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Finding the sign of the enetred number</h2>
    <p id="demo"></p>
    <script>
        let a=prompt("enetr the number:");
        a=Number.parseInt(a);
        let text="";
        if(a < 0){
                text+= a+" is negative number";
            }
            else if(a== 0)
            {
                text += a + " is zero";
            }
            else{
                text+=a + " is positive number";
            }
      
        document.getElementById("demo").innerHTML= text;
    </script>
</body>
</html>
