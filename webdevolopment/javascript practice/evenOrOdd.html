<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> even or odd of numbers</h2>
    <p id="demo"></p>
    <script>
        let text=""
        for(let i=0;i<16;i++){
            if(i%2==0)
            {
                text+=i + " is even"+ "<br>";
            }
            else{
                text+=i +" is odd" + "<br>";
            }
        }
        document.getElementById("demo").innerHTML=text;

        
    </script>
</body>
</html>
