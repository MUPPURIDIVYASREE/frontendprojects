<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>current date and time</h2>
    <p id="demo"></p>
    <p id="demo1"></p>
    <script>
        const a=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"]
        const d=new Date();
        let day=a[d.getDay()]
        document.getElementById("demo").innerHTML="today :" + day;
        document.getElementById("demo1").innerHTML="Current Time is:" + d.getHours() +":" +d.getMinutes()+":" + d.getSeconds() ;
    </script>
</body>
</html>
