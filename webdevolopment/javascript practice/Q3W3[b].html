<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>the current dates in the for mat of</h2>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
    
    <script>
        const d=new Date();
        let year=d.getFullYear();
        let mon=d.getMonth();
        let date=d.getDate();
        document.getElementById("demo1").innerHTML= mon + "-" + date + "-" + year;
        document.getElementById("demo2").innerHTML= mon + "/" + date + "/" + year;
        document.getElementById("demo3").innerHTML= date + "-" + mon + "-" + year;
        document.getElementById("demo4").innerHTML= date + "/" + mon + "/" + year;
    </script>
</body>
</html>
