<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color:white;
        }
        #demo{
            text-decoration: underline;
            color: blue;
        }
        b{
           visibility: hidden;
            color: green;
           
        }
    </style>
</head>
<body>
    <button id="demo" onclick="myfunction()">On mouse over here bold words of the following paragraph will be highlighted]</button>
    <p><b id="c">We</b> have just started <b>this</b> section for the users (<b>beginner</b> to intermediate) who <b>want</b> to work with <b>various</b> JavaScript<b> problems </b>and write scripts online to <b>test</b> their JavaScript <b>skill</b>.</p>
    <p id="demo1">this is the another paragraph</p>
    <p>this is the second para</p>
    <p> this is the first paara</p>
    <h1 id="item1"></h1>
    <h1 id="item2"></h1>
    <script>
        function myfunction(){
            let z=document.getElementsByTagName("b").length;
            for(let i=0;i<z;i++){
                let x=document.getElementsByTagName("b")[i];
                x.style.visibility= "visible";
            }
          document.getElementById("item1").innerHTML="window width: "+screen.width;
          document.getElementById("item2").innerHTML="window height : "+screen.height;
          
    }
 </script>
</body>

</html>
