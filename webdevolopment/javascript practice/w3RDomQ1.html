<html>
<head>
<meta charset=utf-8 />
<title>JS DOM paragraph style</title>
</head> 
<body>
<p id ='text'>JavaScript Exercises - w3resource</p> 
<div>
<button id="jsstyle"
onclick="js_style()">Style</button>
<script>
function js_style(){
    let car=document.getElementById("text");
    car.style.color="red";
    car.style.fontSize="50px";
    car.style.fontFamily="verdana"; 
}

</script>
</div>
</body>
</html>
