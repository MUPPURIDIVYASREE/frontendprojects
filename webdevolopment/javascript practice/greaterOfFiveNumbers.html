    <script>
    let a=prompt("enter the number:");

    let e=prompt("enter the number:");
    a=Number.parseInt(a);

    d=Number.parseInt(d);
    e=Number.parseInt(e);
    if(a > b  &&  a > c &&  a > d &&  a > e )
    {   
        window.alert(a);
    }
    else if(b > a  &&  b > c &&  b > d &&  b > e)
    {
        window.alert(b);
    }
    else if(c > a  &&  c > b &&  c > d &&  c > e)

    }
    else if(d > a  &&  d > c &&  d > b &&  d > e)

    }
    else{
        window.alert(e);
    }
    </script>
