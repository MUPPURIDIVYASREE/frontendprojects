<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="head">the XMLHttp Request object</h1>
    <p id="para1"></p>
    <button  type="button" click="loadDoc()">change the content</button>
    <script>
        function loadDoc(){
            var xttp=new XMLHttpRequest();
            xttp.onreadystatechange = function(){
                if(this.readyState == 4 && this.status == 200 ){
                    document.getElementById("head").innerHTML=this.responseText;
                }
                xttp.open("GET","test.txt",true);
                xttp.send();
            }
        }
    </script>
</body>
</html>
