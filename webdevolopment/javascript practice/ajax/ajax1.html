<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>XML http request</h1>
    <p id="demo"></p>
    <button onclick="loadDoc()">change the content</button>
    
    <script>
        function loadDoc(){
            const x=new XMLHttpRequest();
  x.open("GET","example.txt");
  x.send();
  x.onload=function(){
  document.getElementById("demo").innerHTML=x.responseText+"status:"+x.status+"<br> readyState:"+x.readyState+"<br>statusText:"+x.statusText+"<br>responseheaders:"+x.getResponseHeader("Last-Modified");
  }
        }
        
    </script>
</body>
</html>
