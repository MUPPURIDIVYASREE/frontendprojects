<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="coun">
    <button onclick="loadDoc()">click here</button>
   
    <div id="demo">

    </div>
    <script>
        function loadDoc(){
            var x=new XMLHttpRequest();
            let y=document.getElementById("coun").value;
                let url=`https://restcountries.com/v3.1/name/${y}`;
                console.log(url)
            x.open("GET",url);
            x.send();
            x.onload=function(){
                if(x.status==200){
                    result=x.responseText;
                    result=JSON.parse(result);
                    let [country]=result;
                    console.log(country);
                    document.getElementById("demo").innerHTML=`<img src=${country.flags.png} style="margin:50px 0px 0px 100px">`;
                }
                else{
                    document.getElementById("demo").innerHTML="error";
                }
            }
            x.onprogress=function(){
                document.getElementById("demo").innerHTML="loading";
            }
        }
    </script>
</body>
</html>
