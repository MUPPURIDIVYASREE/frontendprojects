<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
   <form>
  
    <div class="mb-3 mt-5">
        <span class="form-control-plaintext">this is the text of form</span>
        <label class="form-label" for="email">Email:</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="enetr the email">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">password</label>
        <input type="password" class="form-control" id="password" name="pswd" placeholder="password">

    </div>
    <div class=" form-check mb-3">
        <label class="form-check-label">
            <input class="form-check-input" type="checkbox"> remember me
        </label>
    </div>
    <button class="btn btn-primary">submit</button>
   </form>
   <h2 class="mb-3">comments</h2>
   <label class="form-label">comments</label>
   <textarea class="form-control" rows="5"></textarea>
   <h2 class="mb-2">rows/grid</h2>
   <div class="row mb-5">
    <div class="col">
        <input type="text" class="form-control form-control-lg" placeholder="email">
    </div>
    <div class="col">
        <input type="text" class="form-control" placeholder="password">
    </div>
   </div>
   <input type="color" class="form-control form-control-color" value="#CCCCCC">

</body>
</html>
