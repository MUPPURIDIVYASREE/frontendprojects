<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h4>text input group</h4>
    <div class="input-group">
        <span class="input-group-text">@</span>
        <input class="form-control" type="email" placeholder="enetr the email">
    </div>
    <div class="input-group input-group-sm">
        <input class="form-control" type="text" placeholder="enetr name">
        <span class="input-group-text">@eample.com</span>
    </div>
    <h4 class="mb-4">multiple inputs</h4>
    <div class="input-group">
        <span class="input-group-text">person</span>
        <input type="text" class="form-control" placeholder="firstname">
        <input type="text" class="form-control" placeholder="lastname">
    </div>
    <div class="input-group">
        <span class="input-group-text">one</span>
        <span class="input-group-text">two</span>
        <span class="input-group-text">three</span>
        <input class="form-control" type="text">
    </div>
    <h4 class="mt-4"> dropdown input-group</h4>
    <div class="input-group">
    <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">button</button>
    <ul class="dropdown-menu">
        <li class="dropdown-item">value</li>
        <li class="dropdown-item">value</li>
    </ul>
    <input class="form-control" type="text">
    </div>
    <div class="input-group">
        <span class="input-group-text"><input type="checkbox"></span>
        <input class="form-control" type="text" placeholder="the content">
    </div>
</body>
</html>
