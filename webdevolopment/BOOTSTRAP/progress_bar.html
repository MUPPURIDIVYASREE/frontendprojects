<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h2>progress bars</h2>
    <div class="container">
    <div class="progress mb-3">
        <div class="progress-bar" style="width:70%">70%</div>
    </div>
    <div class="progress" style="height:10px">
        <div class="progress-bar bg-success" style="width:70%">70%</div>
    </div>
    </div>
    <div class="progress mt-5">
        <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width:70%">70%</div>
    </div>
    <div class="progress mt-3">
        <span class="progress-bar bg-primary" style="width:30%">white</span>
        <span class="progress-bar bg-danger" style="width:20%">white</span>
        <span class="progress-bar bg-warning" style="width:10%">white</span>
    </div>
    <h4> spinners</h4>
    <div class="spinner-border"></div>
    <div>
        <span class="spinner-border text-success"></span>
        <span class="spinner-border text-danger"></span>
        <span class="spinner-border text-warning"></span>
        <span class="spinner-border text-primary"></span>
    </div>
    <div>
        <span class="spinner-grow text-success"></span>
        <span class="spinner-grow text-danger"></span>
        <span class="spinner-grow text-warning"></span>
        <span class="spinner-grow text-primary"></span>
    </div>
    <h3>pagination</h3>
    <div class="pagination pagination-lg">
       <div class="page-item"> <a href="#" class="page-link">previous</a></div>
       <div class="page-item"><a class="page-link">1</a></div>
       <div class="page-item"><a class="page-link">2</a></div>
       <div class="page-item"><a class="page-link">next</a></div>
    </div>
    <div class="pagination pagination-md justify-content-center">
        <div class="page-item"> <a href="#" class="page-link">previous</a></div>
        <div class="page-item"><a class="page-link">1</a></div>
        <div class="page-item"><a class="page-link">2</a></div>
        <div class="page-item"><a class="page-link">next</a></div>
     </div>
     <div class="pagination pagination-sm justify-content-end">
        <div class="page-item"> <a href="#" class="page-link">previous</a></div>
        <div class="page-item"><a class="page-link">1</a></div>
        <div class="page-item"><a class="page-link">2</a></div>
        <div class="page-item"><a class="page-link">next</a></div>
     </div>
     <h3>BREAD CRUMB</h3>
     <div class="breadcrumb">
        <div class="breadcrumb-item"><a href="#">summer</a></div>
        <div class="breadcrumb-item"><a href="#">winter</a></div>
        <div class="breadcrumb-item"><a href="#">next</a></div>
     </div>
</body>
</html>
