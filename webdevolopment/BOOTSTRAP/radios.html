<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <form >
        <div class="form-check">
            <label class="form-check-label">
                <input class="form-check-input" type="checkbox" checked>option1
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label">
                <input class="form-check-input" type="checkbox">option 2
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label">
                <input class="form-check-input" disabled type="checkbox">disabled
            </label>
        </div>
    </form>

    <div class="form-check">
        <input type="radio" class="form-check-input" name="optradio" id="radio1">option1
        <label class="form-check-label" for="radio1"></label>
    </div>
    <div class="form-check">
        <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1" checked>Option 1
        <label class="form-check-label" for="radio1"></label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">Option 2
        <label class="form-check-label" for="radio2"></label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" disabled>Option 3
        <label class="form-check-label"></label>
      </div> 
      <h3 class="mt-5">toggle-switch </h3>
      <div class="form-check form-switch">
        <input type="checkbox" class="form-check-input" id="myswitch" value="yes" name="darkmode"  checked>toggle switch
        <label class="form-check-label" id="myswitch"></label>
      </div>
      <h4 class="mt-5">range</h4>
      <label for="range">custome range</label>
      <input class="form-range" type="range" step="10" min="0" max="100">
</body>
</html>
