<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="container my-5">
        <button class="btn btn-success">button</button>
        <button class="btn btn-danger">button</button>
        <button class="btn btn-warning">button</button>
        <button class="btn btn-secondary">button</button>
    </div>
    <div class="container my-5">
        <button class="btn btn-outline-success">button</button>
        <button class="btn btn-outline-danger">button</button>
        <button class="btn btn-outline-warning">button</button>
        <button class="btn btn-outline-secondary">button</button>
    </div>
    <div class="container my-5">
        <button class="btn btn-lg btn-success">button</button>
        <button class="btn btn-md btn-success">button</button>
        <button class="btn btn-sm btn-success">button</button>
    </div>
    <h2>block level buttons</h2>
    <div class=" container d-grid gap-3">
    <button class="btn btn-success btn-block">button</button>
    <button class="btn btn-success btn-block">button</button>
    <button class="btn btn-success btn-block">button</button>
    </div>
    <div class="container my-5">
        <button class="btn btn-success active ">button</button>
        <button class="btn btn-success ">button</button>
        <button class="btn btn-success disabled">button</button>
    </div>
    <h2>Spinner buttons</h2>
    <div class="container mb-4">
        <button class="btn btn-primary "><span class="spinner-border spinner-border-sm"></span> </button>
        <button class="btn btn-primary "><span class="spinner-border spinner-border-sm"></span> loading</button>
        <button class="btn btn-primary disabled "><span class="spinner-border spinner-border-sm text-danger"></span> loading</button>
        <button class="btn btn-primary"><span class="spinner-grow spinner-grow-sm"></span>loading</button>
    </div>
</body>
</html>
